  <style>
    :root {
      --cream: #efe6de;
      --cola: #9a0002;
      --ink: #111111;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--cream);
      color: var(--ink);
      font-family: Satoshi, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(420px, 100%);
      text-align: center;
    }

    h1 {
      font-size: clamp(32px, 6vw, 44px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    p {
      margin-top: 14px;
      font-size: 16px;
      line-height: 1.45;
      color: rgba(17, 17, 17, 0.68);
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      min-height: 56px;
      padding: 0 22px;
      border: 1px solid var(--cola);
      border-radius: 2px;
      background: var(--cola);
      color: var(--cream);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      text-decoration: none;
    }

</head>
<body>
  <main>
    <h1>Готово</h1>
    <p>Заявка отправлена. Сейчас откроется Telegram с видеоуроком.</p>
    <a id="bot-link" href="https://t.me/creatorwayBot?start=site">Открыть Telegram</a>
  </main>
  <script>
    (function () {
      var BOT_URL = "https://t.me/creatorwayBot?start=site";
      var started = Date.now();
      var left = false;

      function go() {
        if (left) return;
        left = true;
        window.location.replace(BOT_URL);
      }

      document.getElementById("bot-link").addEventListener("click", function (event) {
        event.preventDefault();
        go();
      });

      function pixelReady() {
        return window.fbq && typeof window.fbq.callMethod === "function";
      }

      function tick() {
        var elapsed = Date.now() - started;
        if (pixelReady()) {
          setTimeout(go, 500);
          return;
        }
        if (elapsed >= 2000) {
          go();
          return;
        }
        setTimeout(tick, 40);
      }

      tick();
    })();
  </script>
</body>
